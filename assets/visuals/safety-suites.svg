<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460">
<rect width="1180" height="460" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The safety suites</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Three ways an agent can hurt someone, three suites that grade them</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="160" width="340" height="100" rx="12" fill="#0B1F4A"/>
<text x="210.0" y="206.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Refusals</text>
<text x="210.0" y="230.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">decline politely, freeze the turn, never refuse the benign</text>
<rect x="420" y="160" width="340" height="100" rx="12" fill="#FEF3C7"/>
<text x="590.0" y="206.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Injection</text>
<text x="590.0" y="230.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">input is data: score from signals, flag the attempt</text>
<rect x="800" y="160" width="340" height="100" rx="12" fill="#0B1F4A"/>
<text x="970.0" y="206.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Permissions</text>
<text x="970.0" y="230.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">one lead never learns or changes another</text>
<text x="40" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Measured: 5 of 5 refusals with 0 false refusals, 3 of 3 injections flagged and ignored,</text>
<text x="40" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">0 cross lead leaks across 46 cases, and lead records byte identical under a shared environment.</text>
