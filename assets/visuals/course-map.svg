<rect x="800" y="380" width="340" height="76" rx="12" fill="#0B1F4A"/>
<text x="970.0" y="414.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Budgets and boundaries</text>
<text x="970.0" y="438.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">costs as tests, MCP, retrieval</text>
<rect x="40" y="500" width="340" height="76" rx="12" fill="#FEF3C7"/>
<text x="210.0" y="534.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Workflow and capstone</text>
<text x="210.0" y="558.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">CI tiers, eval driven development</text>
<text x="40" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Every module tests the same agent and the same 46 gated cases. The capstone assembles all of it.</text>
