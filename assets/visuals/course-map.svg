<line x1="760" y1="298" x2="800" y2="298" stroke="#0891B2" stroke-width="3" marker-end="url(#ah)"/>
<rect x="800" y="260" width="340" height="76" rx="12" fill="#E0F2FE"/>
<text x="970.0" y="294.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Safety suites</text>
<text x="970.0" y="318.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">refusals, injection, permissions</text>
