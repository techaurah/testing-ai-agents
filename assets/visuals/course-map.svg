<rect x="420" y="260" width="340" height="76" rx="12" fill="#0B1F4A"/>
<text x="590.0" y="294.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">State and conversations</text>
