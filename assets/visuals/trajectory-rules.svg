<text x="40" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Lesson 08: 0 violations over 46 gated cases, and 3 hand built bad traces each caught by its own rule.</text>
<text x="40" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Rules forbid bad orderings; they do not script one exact sequence. Goldens do that, for a few conversations.</text>
