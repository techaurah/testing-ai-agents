<text x="40" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Gates: scenarios 24 of 24, safety 12 of 12, regression 10 of 10, goldens 6 of 6 exact,</text>
<text x="40" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">budgets within contract, idempotency verified, at least 7 of 8 mutants killed.</text>
<text x="40" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#475569">Reference build, measured: every gate passes, and 8 of 8 mutants are killed.</text>
