<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker></defs>
<text x="40" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0B1F4A">The capstone flow</text>
<text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#475569">Gates fixed in advance, then build, then grade, then harden</text>
<rect x="40" y="98" width="90" height="5" fill="#0891B2"/>
<rect x="40" y="150" width="240" height="90" rx="12" fill="#FEF3C7"/>
<text x="160.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Spec and gates</text>
<text x="160.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7C5A03">Lesson 29</text>
<rect x="330" y="150" width="240" height="90" rx="12" fill="#0B1F4A"/>
<text x="450.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Build the suite</text>
<text x="450.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">Lesson 30</text>
<rect x="620" y="150" width="240" height="90" rx="12" fill="#0B1F4A"/>
<text x="740.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Evaluate and harden</text>
<text x="740.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#BFE3F2">Lesson 31</text>
<rect x="910" y="150" width="230" height="90" rx="12" fill="#E0F2FE"/>
<text x="1025.0" y="191.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1F4A">Ship it</text>
<text x="1025.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#33506E">Lesson 32</text>
